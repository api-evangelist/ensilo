name: Ensilo
description: >-
  enSilo was an endpoint-security company founded in 2014 (San Francisco and
  Herzliya, Israel) that delivered automated endpoint detection and response
  (EDR), real-time post-infection protection, and data-exfiltration prevention
  in a single agent. Backed by Lightspeed Venture Partners and other investors,
  enSilo was acquired by Fortinet in October 2019 and its technology was folded
  into the FortiEDR product line. The independent enSilo brand, developer
  surface, and public API no longer exist; the ensilo.com domain now redirects
  to Fortinet's site. This profile is retained in the API Evangelist network as
  an acquired-company lead and carries no live API artifacts.
